<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<link rel="icon" type="image/svg+xml" href="/vite.svg" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>mindar-template-esad-2025</title>
		<script src="/src/ext/aframe-v1.5.0.js"></script>
		<script src="/src/ext/mind-ar.js"></script>
	</head>
	<body>
		<a-scene mindar-image="imageTargetSrc: /src/targets.mind;" vr-mode-ui="enabled: false" device-orientation-permission-ui="enabled: false">
			<a-assets>
				<a-video id="card" src="src/Vidéo (2).mp4"></a-video>
				<a-asset-item id="avatarModel" src="/src/Un_chevalet_en_bois_s_1118100818_texture.glb"></a-asset-item>
			</a-assets>

			<a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

			<a-entity mindar-image-target="targetIndex: 0">

				<!-- IMAGE AVEC TRANSPARENCE + Position  -->
				<a-video 
					src="#card" 
					position="0 0 0" 
					height="0.8" 
					width="0" 
					rotation="0 0 0"
					material="transparent: true; alphaTest: 0.1">
				</a-video>

				<!-- Position Chevalet -->
				<a-gltf-model
				rotation="0 0 0" 
				position=" 0 0 0" 
				scale=" 0 0 0"
				height="0" 
				src="#avatarModel"
				></a-gltf-model>

			</a-entity>
		</a-scene>

		<script type="module" src="/src/main.js"></script>
	</body>
